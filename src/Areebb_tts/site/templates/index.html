<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Areeb Site</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header class="topbar">
        <div>
            <h1>Areeb Site</h1>
            <p>Character TTS + Voice Chat</p>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <h2>Voice Setup</h2>
            <label for="dialect-select">Choose dialect</label>
            <select id="dialect-select"></select>

            <label for="model-select">TTS model</label>
            <select id="model-select"></select>

            <p id="model-hint" class="hint">Character is selected automatically per dialect.</p>
        </aside>

        <section class="content">
            <div class="tabs">
                <button id="tab-tts" class="tab active">Script to Voice</button>
                <button id="tab-chat" class="tab">Voice Chat</button>
            </div>

            <section id="panel-tts" class="panel active">
                <h3>Create audio from text</h3>
                <textarea id="tts-input" rows="7" placeholder="Write your script here..."></textarea>
                <button id="tts-generate" class="primary">Generate Audio</button>
                <audio id="tts-audio" controls></audio>
                <p id="tts-status" class="status"></p>
            </section>

            <section id="panel-chat" class="panel">
                <h3>AI Voice Chat</h3>
                <div id="chat-box" class="chat-box"></div>
                <button id="chat-toggle-btn" class="primary chat-toggle">Start Conversation</button>
                <p id="chat-transcript" class="transcript hidden" aria-hidden="true">Press Start Conversation, then speak.</p>
                <p id="chat-status" class="status"></p>
            </section>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>

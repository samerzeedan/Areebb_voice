[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Areebb_tts"
version = "0.1.1"
description = "Areebb_tts: Laying the Open-Source Foundation of Unified-Dialectal Arabic Speech Synthesis"
readme = "README.md"
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "f5-tts>=1.1.5",
    "torch>=2.4.0, <2.9.0",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "requests",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/SWivid/Areebb_tts"

[project.scripts]
"Areebb_tts_infer-cli" = "Areebb_tts.infer.infer_cli:main"
"Areebb_tts_infer-gradio" = "Areebb_tts.infer.infer_gradio:main"
"Areeb_site" = "Areebb_tts.site.app:run"

